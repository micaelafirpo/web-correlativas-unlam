<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Mapa de correlativas</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <h1>Plan de correlativas</h1>

  <!-- Leyenda de años -->
  <div id="leyenda">
    <span class="anio a1">Primer año</span>
    <span class="anio a2">Segundo año</span>
    <span class="anio a3">Tercer año</span>
    <span class="anio a4">Cuarto año</span>
    <span class="anio a5">Quinto año</span>
  </div>

  <button id="reset">Resetear progreso</button>

  <!-- Grafo -->
  <div id="grafo-container">
    <svg id="edges"></svg>
    <div id="nodes"></div>
  </div>

  <script src="app.js"></script>
</body>

</html>
